name: Feature request
description: Suggest an addition or a change
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem you are trying to solve, not only the
        solution you have in mind. The hardware is limited (one clickable
        surface, five actions, no channel information on double and triple
        click), so the useful design space is smaller than it looks.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: |
        The `event` entity plus your own automation, a blueprint, a template -
        knowing what did not work tells us what the integration is missing.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This works with the hardware as documented in the README (no new Zigbee actions are needed).
          required: false
        - label: I searched the existing issues and discussions.
          required: true

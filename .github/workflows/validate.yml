name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Nightly, so that a breaking change in Home Assistant or HACS shows up
    # before a user runs into it.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run the HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # The integration ships its own icon.png / dark_icon.png / logo.png,
          # which Home Assistant serves straight from the integration folder
          # (supported since 2024.11). The HACS check still only looks at the
          # home-assistant/brands repository; a pull request there is pending.
          ignore: brands

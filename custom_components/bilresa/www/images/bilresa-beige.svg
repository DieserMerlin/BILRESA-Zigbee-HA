<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 330"
     role="img" aria-label="IKEA BILRESA remote, Beige" class="bilresa bilresa--beige">
  <title>IKEA BILRESA — Beige</title>
  <defs>
    <linearGradient id="body-beige" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#EBDCC6"/>
      <stop offset="55%" stop-color="#D9C7AC"/>
      <stop offset="100%" stop-color="#B8A488"/>
    </linearGradient>
    <radialGradient id="wheel-beige" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28"/>
    </radialGradient>
    <filter id="shadow-beige" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="glow-beige" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .bilresa .led { fill: #2A2A2A; fill-opacity: .55; transition: fill .18s ease; }
    .bilresa .led-ring { fill: none; stroke: #000; stroke-opacity: .22; stroke-width: 1.2; }
    /* Aktiver Kanal: .mode-1 / .mode-2 / .mode-3 auf einem Vorfahren setzen. */
    .bilresa.mode-1 #led-1, .bilresa.mode-2 #led-2, .bilresa.mode-3 #led-3,
    .bilresa .led.is-active { fill: #FFF3D0; fill-opacity: 1; filter: url(#glow-beige); }
  </style>

  <!-- Gehäuse -->
  <g filter="url(#shadow-beige)">
    <rect x="18" y="12" width="164" height="300" rx="34" fill="url(#body-beige)"/>
    <rect x="18" y="12" width="164" height="300" rx="34" fill="none"
          stroke="#000" stroke-opacity="0.16" stroke-width="1.5"/>
    <!-- Glanzkante oben links -->
    <path d="M52 12 h96 a34 34 0 0 1 34 34 v10 a34 34 0 0 0 -34 -34 h-96
             a34 34 0 0 0 -34 34 v-10 a34 34 0 0 1 34 -34 z"
          fill="#FFF" fill-opacity="0.22"/>
  </g>

  <!-- Scrollrad -->
  <g>
    <circle cx="100" cy="112" r="60" fill="#000" fill-opacity="0.10"/>
    <circle cx="100" cy="112" r="55" fill="#B8A488"/>
    <circle cx="100" cy="112" r="55" fill="url(#wheel-beige)"/>
    <circle cx="100" cy="112" r="55" fill="none" stroke="#000"
            stroke-opacity="0.25" stroke-width="1.5"/>
    <!-- Rändelung -->
    <g stroke="#000" stroke-opacity="0.20" stroke-width="2" stroke-linecap="round">
      <line x1="144.0" y1="112.0" x2="151.0" y2="112.0"/>
      <line x1="143.3" y1="119.6" x2="150.2" y2="120.9"/>
      <line x1="141.3" y1="127.0" x2="147.9" y2="129.4"/>
      <line x1="138.1" y1="134.0" x2="144.2" y2="137.5"/>
      <line x1="133.7" y1="140.3" x2="139.1" y2="144.8"/>
      <line x1="128.3" y1="145.7" x2="132.8" y2="151.1"/>
      <line x1="122.0" y1="150.1" x2="125.5" y2="156.2"/>
      <line x1="115.0" y1="153.3" x2="117.4" y2="159.9"/>
      <line x1="107.6" y1="155.3" x2="108.9" y2="162.2"/>
      <line x1="100.0" y1="156.0" x2="100.0" y2="163.0"/>
      <line x1="92.4" y1="155.3" x2="91.1" y2="162.2"/>
      <line x1="85.0" y1="153.3" x2="82.6" y2="159.9"/>
      <line x1="78.0" y1="150.1" x2="74.5" y2="156.2"/>
      <line x1="71.7" y1="145.7" x2="67.2" y2="151.1"/>
      <line x1="66.3" y1="140.3" x2="60.9" y2="144.8"/>
      <line x1="61.9" y1="134.0" x2="55.8" y2="137.5"/>
      <line x1="58.7" y1="127.0" x2="52.1" y2="129.4"/>
      <line x1="56.7" y1="119.6" x2="49.8" y2="120.9"/>
      <line x1="56.0" y1="112.0" x2="49.0" y2="112.0"/>
      <line x1="56.7" y1="104.4" x2="49.8" y2="103.1"/>
      <line x1="58.7" y1="97.0" x2="52.1" y2="94.6"/>
      <line x1="61.9" y1="90.0" x2="55.8" y2="86.5"/>
      <line x1="66.3" y1="83.7" x2="60.9" y2="79.2"/>
      <line x1="71.7" y1="78.3" x2="67.2" y2="72.9"/>
      <line x1="78.0" y1="73.9" x2="74.5" y2="67.8"/>
      <line x1="85.0" y1="70.7" x2="82.6" y2="64.1"/>
      <line x1="92.4" y1="68.7" x2="91.1" y2="61.8"/>
      <line x1="100.0" y1="68.0" x2="100.0" y2="61.0"/>
      <line x1="107.6" y1="68.7" x2="108.9" y2="61.8"/>
      <line x1="115.0" y1="70.7" x2="117.4" y2="64.1"/>
      <line x1="122.0" y1="73.9" x2="125.5" y2="67.8"/>
      <line x1="128.3" y1="78.3" x2="132.8" y2="72.9"/>
      <line x1="133.7" y1="83.7" x2="139.1" y2="79.2"/>
      <line x1="138.1" y1="90.0" x2="144.2" y2="86.5"/>
      <line x1="141.3" y1="97.0" x2="147.9" y2="94.6"/>
      <line x1="143.3" y1="104.4" x2="150.2" y2="103.1"/>
    </g>
    <circle cx="100" cy="112" r="21" fill="#D9C7AC" fill-opacity="0.92"/>
    <circle cx="100" cy="112" r="21" fill="none" stroke="#000"
            stroke-opacity="0.18" stroke-width="1.2"/>
  </g>

  <!-- Kanal-LEDs -->
  <g>
    <circle id="led-1" class="led" cx="72"  cy="218" r="6"/>
    <circle id="led-2" class="led" cx="100" cy="218" r="6"/>
    <circle id="led-3" class="led" cx="128" cy="218" r="6"/>
    <circle class="led-ring" cx="72"  cy="218" r="8"/>
    <circle class="led-ring" cx="100" cy="218" r="8"/>
    <circle class="led-ring" cx="128" cy="218" r="8"/>
  </g>

  <!-- Untere Taste (Kanalwechsel) -->
  <g>
    <rect x="62" y="248" width="76" height="42" rx="21" fill="#B8A488"/>
    <rect x="62" y="248" width="76" height="42" rx="21" fill="none"
          stroke="#000" stroke-opacity="0.22" stroke-width="1.4"/>
    <rect x="62" y="248" width="76" height="21" rx="21" fill="#FFF" fill-opacity="0.10"/>
  </g>
</svg>

# Service definitions for the IKEA BILRESA Remote integration.
# Names and descriptions live in translations/<lang>.json under "services".

set_mode:
  target:
    device:
      integration: bilresa_remote
    entity:
      integration: bilresa_remote
      domain: select
  fields:
    mode:
      required: true
      example: "2"
      selector:
        text:

next_mode:
  target:
    device:
      integration: bilresa_remote
    entity:
      integration: bilresa_remote
      domain: select
  fields:
    step:
      required: false
      default: 1
      selector:
        number:
          min: -9
          max: 9
          step: 1
          mode: box

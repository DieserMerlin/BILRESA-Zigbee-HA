<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 330"
     role="img" aria-label="IKEA BILRESA remote, White" class="bilresa bilresa--white">
  <title>IKEA BILRESA — White</title>
  <defs>
    <linearGradient id="body-white" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#EAEAE7"/>
      <stop offset="55%" stop-color="#E2E2E0"/>
      <stop offset="100%" stop-color="#C6C6C2"/>
    </linearGradient>
    <filter id="shadow-white" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="glow-white" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .bilresa .led { fill: #2A2A2A; fill-opacity: .55; transition: fill .18s ease; }
    .bilresa .led-ring { fill: none; stroke: #000; stroke-opacity: .22; stroke-width: 1.2; }
    /* Aktiver Kanal: .mode-1 / .mode-2 / .mode-3 auf einem Vorfahren setzen. */
    .bilresa.mode-1 #led-1, .bilresa.mode-2 #led-2, .bilresa.mode-3 #led-3,
    .bilresa .led.is-active { fill: #FFF3D0; fill-opacity: 1; filter: url(#glow-white); }
  </style>

  <!-- Gehäuse -->
  <g filter="url(#shadow-white)">
    <rect x="8.0" y="12.0" width="184.0" height="300.0" rx="92.0" fill="url(#body-white)"/>
    <rect x="8.0" y="12.0" width="184.0" height="300.0" rx="92.0" fill="none"
          stroke="#000" stroke-opacity="0.16" stroke-width="1.5"/>
  </g>

  <!-- Scrollrad: einfarbig, ohne Glanz. Nur eine feine Fuge zeigt, dass es ein
       eigenes Bauteil ist. -->
  <g>
    <circle cx="100.0" cy="104.0" r="85.0" fill="#E2E2E0"/>
    <circle cx="100.0" cy="104.0" r="85.0" fill="none" stroke="#000"
            stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- Kanal-LEDs. Die untere Taste ist von aussen nicht sichtbar und daher
       bewusst nicht dargestellt. -->
  <g>
    <circle id="led-1" class="led" cx="82.0" cy="216.0" r="6.0"/>
    <circle id="led-2" class="led" cx="100.0" cy="216.0" r="6.0"/>
    <circle id="led-3" class="led" cx="118.0" cy="216.0" r="6.0"/>
    <circle class="led-ring" cx="82.0" cy="216.0" r="8"/>
    <circle class="led-ring" cx="100.0" cy="216.0" r="8"/>
    <circle class="led-ring" cx="118.0" cy="216.0" r="8"/>
  </g>
</svg>
